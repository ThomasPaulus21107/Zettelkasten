<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zettelkasten Interaktion</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Zettelkasten Interaktion · lokaler Lesezugriff</p>
        <h1 id="page-title">Finde einen Gedanken.</h1>
        <label class="search-label" for="search">Zettel durchsuchen</label>
        <input id="search" type="search" placeholder="Titel, Alias oder Pfad" autocomplete="off">
        <p id="summary" class="summary">Index wird geladen …</p>
        <div id="type-stats" class="type-stats" aria-label="Bestand nach Typ"></div>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
      <section class="graph-section" aria-labelledby="graph-heading">
        <div class="graph-heading">
          <div><p class="eyebrow">Erkundung</p><h2 id="graph-heading">Graph</h2></div>
          <span class="depth">Relationstiefe: 5 Ebenen</span>
        </div>
        <p id="graph-summary" class="graph-summary">Suche nach einem Zettel, um sein Beziehungsnetz zu erkunden.</p>
        <canvas id="graph-canvas" aria-label="Interaktive Karte der Zettelverbindungen">Dein Browser unterstützt keine Canvas-Ansicht.</canvas>
      </section>
    </main>
    <dialog id="note-dialog" aria-labelledby="note-title"><article>
      <button id="close-note" class="close-note" type="button" aria-label="Zettel schließen">×</button>
      <p id="note-vault" class="eyebrow"></p><h2 id="note-title"></h2><p id="note-path" class="path"></p>
      <dl id="note-metadata"></dl><div id="note-content" class="note-content"></div>
    </article></dialog>
    <template id="result-template">
      <button class="result"><span class="result-title"></span><span class="result-meta"></span></button>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
